backend:
  name: git-gateway
  branch: main

locale: ko

media_library:
  name: cloudinary
  config:
    cloud_name: dr5s1mtyi
    api_key: 284355127593946
    default_transformations:
      - - quality: auto
          fetch_format: auto
          width: 1920
          crop: limit

collections:
  - name: blog
    label: 블로그 포스트
    label_singular: 포스트
    folder: src/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "post-{{year}}{{month}}{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: title, widget: string }
      - label: "작성일"
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "설명", name: description, widget: string }
      - { label: "작성자", name: author, widget: string }
      - label: "대표 이미지"
        name: image
        widget: object
        fields:
          - { label: "이미지", name: url, widget: image }
          - { label: "이미지 설명 (alt)", name: alt, widget: string }
      - { label: "태그", name: tags, widget: list }
      - { label: "본문", name: body, widget: markdown }

  - name: settings
    label: "설정"
    files:
      - name: kakao_picks
        label: "카카오톡 공유 - 소식 선정"
        file: src/data/kakao-picks.json
        fields:
          - label: "선정 게시글 (최대 5개, 위에서부터 순서대로 노출됩니다. 아무것도 선택 안 하면 최신 글 5개가 자동으로 나갑니다.)"
            name: posts
            widget: relation
            collection: blog
            search_fields: [title]
            display_fields: [title]
            value_field: "{{slug}}"
            multiple: true
            min: 0
            max: 5
            required: false
            options_length: 100
