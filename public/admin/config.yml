backend:
  name: git-gateway
  branch: main

locale: ko

media_library:
  name: cloudinary
  config:
    cloud_name: djt4n04dz
    api_key: 912663544675671
    default_transformations:
      - - fetch_format: auto
          quality: auto:low
          flags: lossy

collections:
  - name: blog
    label: 블로그 포스트
    label_singular: 포스트
    folder: src/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "post-{{year}}{{month}}{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: title, widget: string }
      - label: "작성일"
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "설명", name: description, widget: string }
      - { label: "작성자", name: author, widget: string, default: "생터 미디어팀" }
      - label: "대표 이미지"
        name: image
        widget: object
        fields:
          - { label: "이미지", name: url, widget: image }
          - { label: "이미지 설명 (alt)", name: alt, widget: string }
      - { label: "태그", name: tags, widget: list }
      - { label: "본문", name: body, widget: markdown }
