backend:
  name: git-gateway
  branch: main

locale: ko

media_library:
  name: cloudinary
  config:
    cloud_name: dr5s1mtyi
    api_key: 284355127593946
    default_transformations:
      - - quality: auto
          fetch_format: auto
          width: 1920
          crop: limit

collections:
  - name: blog
    label: 블로그 포스트
    label_singular: 포스트
    folder: src/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "post-{{year}}{{month}}{{day}}-{{slug}}"
    fields:
      - { label: "제목", name: title, widget: string }
      - label: "작성일"
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "설명", name: description, widget: string }
      - { label: "작성자", name: author, widget: string }
      - label: "대표 이미지"
        name: image
        widget: object
        fields:
          - { label: "이미지", name: url, widget: image }
          - { label: "이미지 설명 (alt)", name: alt, widget: string }
      - { label: "태그", name: tags, widget: list }
      - label: "카카오톡 소식 노출 순서"
        name: kakaoOrder
        widget: number
        value_type: int
        min: 1
        max: 5
        required: false
        hint: "카카오톡 공유 리스트에 넣고 싶으면 1~5 사이 숫자를 입력하세요 (숫자가 작을수록 먼저 노출). 비워두면 이 글은 목록에서 제외됩니다. 아무 글도 지정하지 않으면 최신 글 5개가 자동으로 나갑니다."
      - { label: "본문", name: body, widget: markdown }
