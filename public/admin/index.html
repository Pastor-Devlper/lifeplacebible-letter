<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 생터 레터</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://media-library.cloudinary.com/global/all.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 저장 시 작성자 필드가 비어있으면 계정 이름으로 채움
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          if (entry.get('collection') !== 'blog') return;
          const user = window.netlifyIdentity?.currentUser();
          if (!user) return;
          const name = user.user_metadata?.full_name || user.email;
          try {
            if (!entry.getIn(['data', 'author'])) {
              return entry.get('data').set('author', name);
            }
          } catch (e) {}
        }
      });

      CMS.init();

      // '빠른 추가'와 아바타 사이에 사용자 이름을 DOM으로 삽입
      const BADGE_ID = 'cms-user-badge';

      function insertBadge(name) {
        if (document.getElementById(BADGE_ID)) return true;

        const avatar = document.querySelector('[aria-label="Account options dropdown"]');
        if (!avatar) return false;

        // 아바타 래퍼 (StyledWrapper div)
        const avatarWrapper = avatar.parentElement;
        const actionsContainer = avatarWrapper && avatarWrapper.parentElement;
        if (!actionsContainer) return false;

        const badge = document.createElement('div');
        badge.id = BADGE_ID;
        badge.textContent = name;
        badge.style.cssText = `
          display: flex;
          align-items: center;
          font-size: 12px;
          font-family: sans-serif;
          white-space: nowrap;
          color: #1E2532;
          background: rgba(255,255,255,0.85);
          padding: 3px 10px;
          border-radius: 10px;
          pointer-events: none;
        `;

        // '빠른 추가'와 아바타 사이에 삽입
        actionsContainer.insertBefore(badge, avatarWrapper);
        return true;
      }

      let currentUserName = null;

      // 배지가 사라지면 자동으로 다시 삽입 (페이지 전환 대응)
      const persistObserver = new MutationObserver(() => {
        if (currentUserName && !document.getElementById(BADGE_ID)) {
          insertBadge(currentUserName);
        }
      });
      persistObserver.observe(document.body, { childList: true, subtree: true });

      function showUser() {
        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        currentUserName = user ? (user.user_metadata?.full_name || user.email) : null;

        const existing = document.getElementById(BADGE_ID);
        if (!currentUserName) { if (existing) existing.remove(); return; }
        if (existing) { existing.textContent = currentUserName; return; }

        insertBadge(currentUserName);
      }

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', showUser);
        window.netlifyIdentity.on('login', showUser);
        window.netlifyIdentity.on('logout', showUser);
      }

      // 새 포스트 작성 시 작성자 필드에 계정 이름 자동 입력
      function tryFillAuthor() {
        if (!location.hash.includes('/new')) return false;

        const user = window.netlifyIdentity?.currentUser();
        if (!user) return false;
        const name = user.user_metadata?.full_name || user.email;

        // label·span 모두에서 "작성자" 텍스트 탐색
        const authorLabel = Array.from(document.querySelectorAll('label, span')).find(
          el => el.children.length === 0 && el.textContent.trim() === '작성자'
        );
        if (!authorLabel) return false;

        // 상위 컨테이너를 최대 6단계 올라가며 input 탐색
        let container = authorLabel;
        for (let i = 0; i < 6; i++) {
          container = container.parentElement;
          if (!container) break;
          const input = container.querySelector('input[type="text"]');
          if (input) {
            if (input.value) return true; // 이미 값 있으면 유지
            const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
            setter.call(input, name);
            input.dispatchEvent(new Event('input', { bubbles: true }));
            return true;
          }
        }
        return false;
      }

      function scheduleAuthorFill() {
        let tries = 0;
        const timer = setInterval(() => {
          if (tryFillAuthor() || ++tries > 20) clearInterval(timer);
        }, 250);
      }

      window.addEventListener('hashchange', scheduleAuthorFill);
    </script>
  </body>
</html>
