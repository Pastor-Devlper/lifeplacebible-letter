<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 생터 레터</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 업로드 전 브라우저에서 1MB 이하로 압축
      function compressImage(file, maxMB = 1) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let { width, height } = img;

              // 최대 가로/세로 1920px 제한
              const maxDim = 1920;
              if (width > maxDim || height > maxDim) {
                const ratio = Math.min(maxDim / width, maxDim / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);

              // 품질을 낮춰가며 1MB 이하가 될 때까지 반복
              let quality = 0.85;
              const tryCompress = () => {
                canvas.toBlob((blob) => {
                  if (blob.size <= maxMB * 1024 * 1024 || quality <= 0.2) {
                    resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
                  } else {
                    quality = Math.round((quality - 0.1) * 10) / 10;
                    tryCompress();
                  }
                }, 'image/jpeg', quality);
              };
              tryCompress();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      CMS.registerMediaLibrary({
        name: 'cloudinary-unsigned',
        init: ({ options, handleInsert, handleClose }) => {
          return {
            show: () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = 'image/*';
              input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 1단계: 압축
                let compressed;
                try {
                  compressed = await compressImage(file);
                } catch (err) {
                  alert('이미지 압축 실패: ' + err.message);
                  return;
                }

                // 2단계: Cloudinary 업로드
                let uploadedUrl;
                try {
                  const formData = new FormData();
                  formData.append('file', compressed);
                  formData.append('upload_preset', 'decap_cms');

                  const res = await fetch(
                    'https://api.cloudinary.com/v1_1/djt4n04dz/image/upload',
                    { method: 'POST', body: formData }
                  );
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                  uploadedUrl = data.secure_url;
                } catch (err) {
                  alert('Cloudinary 업로드 실패: ' + err.message);
                  return;
                }

                // 3단계: CMS에 URL 삽입
                try {
                  handleInsert(uploadedUrl);
                } catch (e1) {
                  try {
                    handleInsert([uploadedUrl]);
                  } catch (e2) {
                    alert('CMS 삽입 오류: ' + e2.message + '\n\nURL:\n' + uploadedUrl);
                    return;
                  }
                }
                try { handleClose(); } catch (_) {}
              };
              input.click();
            },
            hide: () => {},
            enableStandalone: () => true,
          };
        },
      });

      CMS.init();

      // 아바타 옆에 사용자 이름 표시
      let nameLabel = null;

      function attachNameToAvatar(name) {
        // 이미 붙어 있으면 텍스트만 업데이트
        if (nameLabel) { nameLabel.textContent = name; return; }

        // 화면 상단 우측 영역에서 아바타 img 탐색
        const avatarImg = Array.from(document.querySelectorAll('img')).find(img => {
          const r = img.getBoundingClientRect();
          return r.top < 80 && r.right > window.innerWidth - 200 && r.width > 10;
        });

        if (!avatarImg) return; // 아직 렌더링 전 → 재시도

        nameLabel = document.createElement('span');
        nameLabel.textContent = name;
        nameLabel.style.cssText = `
          color: #fff;
          font-size: 13px;
          font-family: sans-serif;
          white-space: nowrap;
          margin-left: 8px;
          line-height: 1;
          pointer-events: none;
        `;

        // 아바타의 부모(버튼 등) 안에 인라인으로 삽입
        const parent = avatarImg.parentElement;
        parent.style.display = 'flex';
        parent.style.alignItems = 'center';
        parent.appendChild(nameLabel);
      }

      function showUser() {
        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        const name = user ? (user.user_metadata?.full_name || user.email) : null;
        if (!name) { if (nameLabel) nameLabel.textContent = ''; return; }

        attachNameToAvatar(name);

        // 아바타가 아직 없으면 DOM 변화 감지 후 재시도
        if (!nameLabel) {
          const observer = new MutationObserver(() => {
            attachNameToAvatar(name);
            if (nameLabel) observer.disconnect();
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      }

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', showUser);
        window.netlifyIdentity.on('login', showUser);
        window.netlifyIdentity.on('logout', showUser);
      }
    </script>
  </body>
</html>
