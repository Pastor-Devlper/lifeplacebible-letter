<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 - 생터 레터</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 업로드 전 브라우저에서 1MB 이하로 압축
      function compressImage(file, maxMB = 1) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let { width, height } = img;

              // 최대 가로/세로 1920px 제한
              const maxDim = 1920;
              if (width > maxDim || height > maxDim) {
                const ratio = Math.min(maxDim / width, maxDim / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);

              // 품질을 낮춰가며 1MB 이하가 될 때까지 반복
              let quality = 0.85;
              const tryCompress = () => {
                canvas.toBlob((blob) => {
                  if (blob.size <= maxMB * 1024 * 1024 || quality <= 0.2) {
                    resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
                  } else {
                    quality = Math.round((quality - 0.1) * 10) / 10;
                    tryCompress();
                  }
                }, 'image/jpeg', quality);
              };
              tryCompress();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      CMS.registerMediaLibrary({
        name: 'cloudinary-unsigned',
        init: ({ options, handleInsert, handleClose }) => {
          return {
            show: () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = 'image/*';
              input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // 1단계: 압축
                let compressed;
                try {
                  compressed = await compressImage(file);
                } catch (err) {
                  alert('이미지 압축 실패: ' + err.message);
                  return;
                }

                // 2단계: Cloudinary 업로드
                let uploadedUrl;
                try {
                  const formData = new FormData();
                  formData.append('file', compressed);
                  formData.append('upload_preset', 'decap_cms');

                  const res = await fetch(
                    'https://api.cloudinary.com/v1_1/djt4n04dz/image/upload',
                    { method: 'POST', body: formData }
                  );
                  const data = await res.json();
                  if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                  uploadedUrl = data.secure_url;
                } catch (err) {
                  alert('Cloudinary 업로드 실패: ' + err.message);
                  return;
                }

                // 3단계: CMS에 URL 삽입
                try {
                  handleInsert(uploadedUrl);
                } catch (e1) {
                  try {
                    handleInsert([uploadedUrl]);
                  } catch (e2) {
                    alert('CMS 삽입 오류: ' + e2.message + '\n\nURL:\n' + uploadedUrl);
                    return;
                  }
                }
                try { handleClose(); } catch (_) {}
              };
              input.click();
            },
            hide: () => {},
            enableStandalone: () => true,
          };
        },
      });

      CMS.init();

      // 아바타 DOM 안에 사용자 이름을 직접 삽입
      const BADGE_ID = 'cms-user-badge';

      function findAvatarSvg() {
        return Array.from(document.querySelectorAll('svg')).find(el => {
          const r = el.getBoundingClientRect();
          return r.top < 80 && r.top >= 0
            && r.right > window.innerWidth - 100
            && r.width >= 28 && r.width <= 40;
        });
      }

      function insertBadge(name) {
        if (document.getElementById(BADGE_ID)) return true;

        const avatar = findAvatarSvg();
        if (!avatar) return false;

        // 아바타를 감싸는 컨테이너 (button 또는 부모 div)
        const container = avatar.closest('button') || avatar.parentElement;

        const badge = document.createElement('span');
        badge.id = BADGE_ID;
        badge.textContent = name;
        badge.style.cssText = `
          display: block;
          text-align: center;
          font-size: 11px;
          font-family: sans-serif;
          white-space: nowrap;
          color: #fff;
          background: rgba(0,0,0,0.55);
          padding: 2px 7px;
          border-radius: 10px;
          margin-top: 2px;
          pointer-events: none;
          line-height: 1.4;
        `;

        // 아바타 SVG 크기 고정
        avatar.style.width = '32px';
        avatar.style.height = '32px';
        avatar.style.flexShrink = '0';

        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.alignItems = 'center';
        container.style.overflow = 'visible';

        // 조상 요소의 overflow:hidden 해제
        let ancestor = container.parentElement;
        for (let i = 0; i < 5; i++) {
          if (!ancestor) break;
          ancestor.style.overflow = 'visible';
          ancestor = ancestor.parentElement;
        }

        container.appendChild(badge);
        return true;
      }

      function showUser() {
        const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
        const name = user ? (user.user_metadata?.full_name || user.email) : null;

        const existing = document.getElementById(BADGE_ID);
        if (!name) { if (existing) existing.remove(); return; }
        if (existing) { existing.textContent = name; return; }

        if (insertBadge(name)) return;

        // CMS 렌더링 완료 전이면 MutationObserver로 재시도
        const observer = new MutationObserver(() => {
          if (insertBadge(name)) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(() => observer.disconnect(), 10000);
      }

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', showUser);
        window.netlifyIdentity.on('login', showUser);
        window.netlifyIdentity.on('logout', showUser);
      }
    </script>
  </body>
</html>
